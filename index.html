<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ABRSM Grade 1–5 music theory quiz, including terms, signs, notation, and intervals." />
    <title>Music Theory Quiz</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="interval-matrix.js" defer></script>
    <script src="vendor/abcjs-basic-min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">ABRSM MUSIC THEORY · GRADES 1–5</p>
          <h1>Music Theory Quiz</h1>
          <a class="text-link" href="question-bank.html">Browse the full question bank</a>
        </div>
        <div class="header-mark" aria-hidden="true">♪</div>
      </header>

      <section id="test-screen" class="screen" aria-live="polite">
        <div class="category-selector" role="group" aria-label="Question category">
          <span class="category-selector-label">Question category</span>
          <div class="category-buttons">
            <button class="category-button active" type="button" data-category="terms" aria-pressed="true">Terms, Signs, and Notations</button>
            <button class="category-button" type="button" data-category="intervals" aria-pressed="false">Intervals</button>
            <button class="category-button" type="button" data-category="pitches" aria-pressed="false">Pitch</button>
            <button class="category-button" type="button" data-category="tonic-triads" aria-pressed="false">Tonic triads</button>
            <button class="category-button" type="button" data-category="time-signatures" aria-pressed="false">Time signatures</button>
            <button class="category-button" type="button" data-category="key-signatures" aria-pressed="false">Key signatures</button>
          </div>
        </div>
        <div class="grade-selector" role="group" aria-label="Maximum practice grade">
          <span class="grade-selector-label">Practise through grade</span>
          <div class="grade-dots" aria-label="Choose the highest grade to include">
            <span class="grade-dots-line" aria-hidden="true"></span>
            <button class="grade-dot" type="button" data-grade="1" aria-pressed="false" aria-label="Practise through Grade 1">1</button>
            <button class="grade-dot" type="button" data-grade="2" aria-pressed="false" aria-label="Practise through Grade 2">2</button>
            <button class="grade-dot active" type="button" data-grade="3" aria-pressed="true" aria-label="Practise through Grade 3">3</button>
            <button class="grade-dot" type="button" data-grade="4" aria-pressed="false" aria-label="Practise through Grade 4">4</button>
            <button class="grade-dot" type="button" data-grade="5" aria-pressed="false" aria-label="Practise through Grade 5">5</button>
          </div>
          <span class="grade-selector-help">About half of each test uses the highest available grade.</span>
        </div>
        <div class="test-options">
          <label for="test-length">Questions per test
            <select id="test-length" aria-label="Number of questions">
              <option value="15" selected>15</option>
              <option value="10">10</option>
              <option value="5">5</option>
            </select>
          </label>
          <label class="timer-toggle" for="timer-enabled"><input id="timer-enabled" type="checkbox" /> Timed mode · 20s per question</label>
        </div>
        <div class="progress-row">
          <span id="progress-label">Question 1 of 15</span>
          <span id="score-label">0 correct</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>

        <article class="question-card">
          <div class="question-meta"><span id="grade-badge" class="grade-badge">Grade 1</span><span class="question-meta-right"><span id="question-timer" class="question-timer hidden" aria-label="Time remaining">20s</span><span id="question-number">01</span></span></div>
          <h2 id="question-text"></h2>
          <div id="question-image-wrap" class="question-image-wrap hidden"><img id="question-image" alt="Musical notation for this question" /></div>
          <div id="question-notation-wrap" class="question-notation-wrap hidden"><div id="question-notation" role="img"></div></div>
          <div id="answers" class="answers" role="radiogroup" aria-label="Answer choices"></div>
          <p id="feedback" class="feedback" role="status"></p>
          <button id="next-button" class="primary-button" type="button" disabled>Choose an answer</button>
        </article>
      </section>

      <section id="result-screen" class="screen hidden" aria-live="polite">
        <div class="result-hero">
          <p class="eyebrow">TEST COMPLETE</p>
          <h2 id="result-title">Your results</h2>
          <p id="result-summary" class="result-summary"></p>
        </div>
        <div id="review" class="review-list"></div>
        <button id="restart-button" class="primary-button" type="button">Do another test</button>
      </section>

      <footer class="site-footer"><span data-app-version></span> · © 2026 HuyNQ - <a href="privacy-policy.html">Privacy Policy</a></footer>
    </main>
  </body>
</html>
